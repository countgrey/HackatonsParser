version: '3.8'

services:
  # Контейнер с Ollama и моделью Mistral
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - hackatons_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Инициализация модели Mistral в Ollama (выполняется один раз)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - hackatons_network
    command: >
      sh -c "
        echo 'Ожидание готовности Ollama...' &&
        sleep 10 &&
        echo 'Загрузка модели Mistral...' &&
        ollama pull mistral:7b &&
        echo 'Модель Mistral успешно загружена!' &&
        echo 'Проверка модели:' &&
        ollama list
      "
    restart: "no"

  # Контейнер парсера
  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    container_name: hackatons-parser
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
      - smart_filtered_db:/app
    environment:
      - TZ=Europe/Moscow
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - hackatons_network
    # Парсер запускается по расписанию, но можно запустить вручную
    command: ["python", "run_parser.py", "--scheduler"]

  # Контейнер Telegram бота
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: hackatons-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
      - smart_filtered_db:/app
    environment:
      - TZ=Europe/Moscow
      - DATABASE_NAME=/app/smart_filtered.db
    depends_on:
      - parser  # Дожидаемся создания базы данных
    networks:
      - hackatons_network
    # Бот работает постоянно
    command: ["python", "run_bot.py"]

networks:
  hackatons_network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  smart_filtered_db:
    driver: local